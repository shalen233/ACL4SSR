port: 7890
socks-port: 7891
allow-lan: true
mode: Rule
log-level: info
external-controller: 127.0.0.1:9090
proxies: 
  - name: "直连"
    type: direct
    udp: true
proxy-groups:
  - name: 默认
    type: select
    proxies: [直连]
rule-providers:  
  217heihei规则:
    type: http
    behavior: domain
    format: yaml
    path: ./rule_providers/adblockmihomo.yaml
    url: "https://gh-proxy.org/https://raw.githubusercontent.com/217heidai/adblockfilters/main/rules/adblockmihomo.yaml"
    interval: 86400
rules:
  - RULE-SET,217heihei规则,REJECT