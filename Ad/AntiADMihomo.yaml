port: 7890
socks-port: 7891
allow-lan: true
mode: Rule
log-level: info
external-controller: 127.0.0.1:9090
proxies: 
  - name: "直连"
    type: direct
    udp: true
proxy-groups:
  - name: 默认
    type: select
    proxies: [直连]
rule-providers:  
  AntiAD规则:
    type: http
    behavior: domain
    format: yaml
    path: ./rule_providers/mihomo.mrs
    url: "https://gh-proxy.org/https://raw.githubusercontent.com/privacy-protection-tools/anti-ad.github.io/master/docs/mihomo.mrs"
    interval: 86400
rules:
  - RULE-SET,AntiAD规则,REJECT