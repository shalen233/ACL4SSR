port: 7890
socks-port: 7891
allow-lan: true
mode: Rule
log-level: info
external-controller: 127.0.0.1:9090
proxies: 
  - name: "直连"
    type: direct
    udp: true
proxy-groups:
  - name: 默认
    type: select
    proxies: [直连]
rule-providers:  
  AntiAD拦截规则:
    type: http
    behavior: domain
    format: yaml
    path: ./rule_providers/anti-ad-clash.yaml
    url: "https://gh-proxy.org/https://raw.githubusercontent.com/privacy-protection-tools/anti-AD/master/anti-ad-clash.yaml"
    interval: 86400
  AntiAD白名单规则:
    type: http
    behavior: domain
    format: yaml
    path: ./rule_providers/anti-ad-white-for-clash.yaml
    url: "https://gh-proxy.org/https://raw.githubusercontent.com/privacy-protection-tools/dead-horse/master/anti-ad-white-for-clash.yaml"
    interval: 86400
rules:
  - RULE-SET,AntiAD拦截规则,REJECT
  - RULE-SET,AntiAD白名单规则,DIRECT